log_format upstreamlog '[$time_local] $remote_addr to: $upstream_addr: $request status: $status';

upstream backend_cluster {
    server 192.168.56.103:5001;
    server 192.168.56.103:5002;
}

server {
    listen 80;
    server_name localhost;

    access_log /var/log/nginx/access.log upstreamlog;
    client_max_body_size 10M;

    # 1. Melayani Flutter Web SPA
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # 2. Reverse Proxy Load Balancer ke 2 Container Backend
    location /api/ {
        proxy_pass http://backend_cluster;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_pass_header X-Served-By;
    }

    # 3. Akses Foto Selfie Presensi
    location /uploads/ {
        proxy_pass http://backend_cluster/uploads/;
        proxy_set_header Host $host;
    }
}

