name: absensi
description: "Aplikasi Absensi Karyawan - Employee Attendance Management"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Firebase
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  cloud_firestore: ^6.10.0

  # State Management
  provider: ^6.1.2

  # UI
  google_fonts: ^6.2.1

  # Biometric / Fingerprint
  local_auth: ^2.3.0

  # Camera for selfie attendance
  image_picker: ^1.1.2

  # Date formatting
  intl: ^0.20.2

  # Animations
  flutter_staggered_animations: ^1.1.1
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
